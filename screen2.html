<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Green Fusion — Kitchen & Cafe Bar</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  body { 
    background: #FAF5EA; color: #2B2822; font-family: 'Jost', sans-serif; 
    margin: 0; padding: 30px; height: 100vh; overflow: hidden; 
    display: flex; flex-direction: column; position: relative;
  }
  .bg-animation {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    overflow: hidden; z-index: 0; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
  }
  .bg-logo {
    position: absolute;
    width: 80vw;
    height: 80vh;
    max-width: 1000px;
    max-height: 1000px;
    background-image: url('logo.jpeg');
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    opacity: 0.28;
    z-index: 0;
    user-select: none;
  }
  .floating-item {
    position: absolute; top: -10vh; font-size: 4.5rem; opacity: 0.4; animation: fall linear infinite;
  }
  @keyframes fall {
    0% { transform: translateY(-10vh) rotate(0deg); }
    100% { transform: translateY(110vh) rotate(360deg); }
  }
  h1, .slide-container { position: relative; z-index: 1; }
  h1 { font-family: 'Cormorant Garamond', serif; font-size: 52px; font-weight: 700; color: #333F20; text-align: center; margin: 0 0 25px 0; text-shadow: 0 2px 4px rgba(250,245,234,0.8); }
  
  .slide-container {
    flex: 1; max-width: 1400px; width: 100%; margin: 0 auto;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    opacity: 1; transition: opacity 0.8s ease-in-out;
  }
  .fade-out { opacity: 0 !important; }

  .category-title {
    font-family: 'Cormorant Garamond', serif; font-size: 44px; font-weight: 700; color: #BD5B34; 
    margin-bottom: 25px; text-align: center; border-bottom: 3px solid rgba(189,91,52,0.4); padding-bottom: 8px; width: 100%;
    text-shadow: 0 2px 4px rgba(250,245,234,0.9);
  }
  .menu-grid {
    width: 100%; display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px;
  }
  .item-row { 
    background: rgba(255, 255, 255, 0.95); padding: 20px 25px; border-radius: 10px; 
    display: flex; justify-content: space-between; align-items: center; 
    border: 2px solid rgba(51,63,32,0.2); font-size: 22px; font-weight: 700; 
    box-shadow: 0 6px 16px rgba(0,0,0,0.06); backdrop-filter: blur(6px); 
  }
  .item-price { color: #BD5B34; font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 28px; }
  .sold-out { opacity: 0.4; }
</style>
</head>
<body>
  <div class="bg-animation">
    <div class="bg-logo"></div>
    <div class="floating-item" style="left: 15%; animation-duration: 11s; animation-delay: 0s;">☕</div>
    <div class="floating-item" style="left: 45%; animation-duration: 14s; animation-delay: 2s;">🥪</div>
    <div class="floating-item" style="left: 75%; animation-duration: 10s; animation-delay: 1s;">🍟</div>
  </div>

  <h1>☕ Kitchen &amp; Cafe Bar 🥪</h1>
  <div class="slide-container" id="slide-box">Loading Menu...</div>

<script>
  const sb = supabase.createClient("https://vdabufmcqzdilkhzrxim.supabase.co", "sb_publishable_D_7MmPn7tLWsxcPnuH6aHA_I_V19fJ6");
  const targetCategories = ['☕ Coffee & Espresso', '🥪 Sandwiches', '🍟 French Fries', '🧀 Cheese Corner', '🍜 Quick Bites', '🍝 Pasta', '🥣 Soups', '🫖 Tea'];
  let groupedData = {}, categoryKeys = [], currentIndex = 0, slideInterval;

  async function fetchMenu() {
    const { data } = await sb.from('menu_items').select('*').in('category', targetCategories);
    groupedData = {};
    data.forEach(item => {
      if (!groupedData[item.category]) groupedData[item.category] = [];
      groupedData[item.category].push(item);
    });
    categoryKeys = Object.keys(groupedData);
    if (categoryKeys.length > 0) {
      showSlide();
      if (!slideInterval) slideInterval = setInterval(nextSlide, 7000);
    }
  }

  function showSlide() {
    const box = document.getElementById('slide-box');
    const cat = categoryKeys[currentIndex];
    const items = groupedData[cat];

    box.classList.add('fade-out');
    setTimeout(() => {
      let itemsHtml = items.map(item => `
        <div class="item-row ${item.stock <= 0 ? 'sold-out' : ''}">
          <span>${item.name} ${item.stock <= 0 ? '— (Sold Out)' : ''}</span>
          <span class="item-price">₹${item.price}</span>
        </div>
      `).join('');

      box.innerHTML = `
        <div class="category-title">${cat}</div>
        <div class="menu-grid">${itemsHtml}</div>
      `;
      box.classList.remove('fade-out');
    }, 800);
  }

  function nextSlide() {
    currentIndex = (currentIndex + 1) % categoryKeys.length;
    showSlide();
  }

  fetchMenu();
  sb.channel('screen2').on('postgres_changes', { event: '*', schema: 'public', table: 'menu_items' }, fetchMenu).subscribe();
</script>
</body>
</html>
