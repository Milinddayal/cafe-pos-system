<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Green Fusion — Ice Creams & Shakes</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Jost:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  body { 
    background: #FAF5EA; color: #2B2822; font-family: 'Jost', sans-serif; 
    margin: 0; padding: 30px; height: 100vh; overflow: hidden; 
    display: flex; flex-direction: column; position: relative;
  }
  .bg-animation {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    overflow: hidden; z-index: 0; pointer-events: none;
  }
  .floating-item {
    position: absolute; top: -10vh; font-size: 4rem; opacity: 0.35; animation: fall linear infinite;
  }
  @keyframes fall {
    0% { transform: translateY(-10vh) rotate(0deg); }
    100% { transform: translateY(110vh) rotate(360deg); }
  }
  h1, .slide-container { position: relative; z-index: 1; }
  h1 { font-family: 'Cormorant Garamond', serif; font-size: 48px; color: #333F20; text-align: center; margin: 0 0 30px 0; }
  
  .slide-container {
    flex: 1; max-width: 1200px; width: 100%; margin: 0 auto;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    opacity: 1; transition: opacity 1s ease-in-out;
  }
  .fade-out { opacity: 0 !important; }

  .category-title {
    font-family: 'Cormorant Garamond', serif; font-size: 38px; color: #BD5B34; 
    margin-bottom: 25px; text-align: center; border-bottom: 2px solid rgba(189,91,52,0.3); padding-bottom: 10px; width: 100%;
  }
  .menu-grid {
    width: 100%; display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px;
  }
  .item-row { 
    background: rgba(255, 255, 255, 0.95); padding: 20px 25px; border-radius: 8px; 
    display: flex; justify-content: space-between; align-items: center; 
    border: 1px solid rgba(43,40,34,0.1); font-size: 22px; backdrop-filter: blur(2px); 
  }
  .item-price { color: #BD5B34; font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 28px; }
  .sold-out { opacity: 0.4; }
</style>
</head>
<body>
  <div class="bg-animation">
    <div class="floating-item" style="left: 15%; animation-duration: 11s; animation-delay: 0s;">🍨</div>
    <div class="floating-item" style="left: 45%; animation-duration: 14s; animation-delay: 2s;">🥤</div>
    <div class="floating-item" style="left: 75%; animation-duration: 10s; animation-delay: 1s;">🍦</div>
  </div>

  <h1>🍨 Green Fusion Menu 🥤</h1>
  <div class="slide-container" id="slide-box">Loading Menu...</div>

<script>
  const sb = supabase.createClient("https://vdabufmcqzdilkhzrxim.supabase.co", "sb_publishable_D_7MmPn7tLWsxcPnuH6aHA_I_V19fJ6");
  const targetCategories = ['🍨 Ice Creams', '🥤 Shakes'];
  let groupedData = {};
  let categoryKeys = [];
  let currentIndex = 0;
  let slideInterval;

  async function fetchMenu() {
    const { data } = await sb.from('menu_items').select('*').in('category', targetCategories);
    groupedData = {};
    data.forEach(item => {
      if (!groupedData[item.category]) groupedData[item.category] = [];
      groupedData[item.category].push(item);
    });
    categoryKeys = Object.keys(groupedData);
    if (categoryKeys.length > 0) {
      showSlide();
      if (!slideInterval) slideInterval = setInterval(nextSlide, 7000); // changes category every 7 seconds
    }
  }

  function showSlide() {
    const box = document.getElementById('slide-box');
    const cat = categoryKeys[currentIndex];
    const items = groupedData[cat];

    box.classList.add('fade-out');
    setTimeout(() => {
      let itemsHtml = items.map(item => `
        <div class="item-row ${item.stock <= 0 ? 'sold-out' : ''}">
          <span><b>${item.name}</b> ${item.stock <= 0 ? '— (Sold Out)' : ''}</span>
          <span class="item-price">₹${item.price}</span>
        </div>
      `).join('');

      box.innerHTML = `
        <div class="category-title">${cat}</div>
        <div class="menu-grid">${itemsHtml}</div>
      `;
      box.classList.remove('fade-out');
    }, 1000); // 1 second fade duration
  }

  function nextSlide() {
    currentIndex = (currentIndex + 1) % categoryKeys.length;
    showSlide();
  }

  fetchMenu();
  sb.channel('screen1').on('postgres_changes', { event: '*', schema: 'public', table: 'menu_items' }, fetchMenu).subscribe();
</script>
</body>
</html>
