<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Green Fusion — Secure POS Billing</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; font-family: 'Jost', sans-serif; }
  body { background: #FAF5EA; margin: 0; padding: 0; display: flex; height: 100vh; color: #2B2822; }
  
  /* Login Screen */
  #login-screen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #333F20; display: flex; align-items: center; justify-content: center;
    z-index: 1000;
  }
  .login-box {
    background: white; padding: 40px; border-radius: 12px; width: 100%; max-width: 400px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3); text-align: center;
  }
  .login-box h2 { color: #333F20; margin-top: 0; }
  .input-field {
    width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 16px;
  }
  .login-btn {
    width: 100%; padding: 12px; background: #BD5B34; color: white; border: none; 
    border-radius: 6px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 15px;
  }
  .login-btn:hover { background: #a04926; }
  #login-error { color: red; margin-top: 10px; display: none; font-weight: 500; }

  /* Billing Dashboard (Hidden by Default) */
  #billing-dashboard {
    display: none; width: 100%; display: flex; flex-direction: column; padding: 20px;
  }
  .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ccc; padding-bottom: 10px; margin-bottom: 20px; }
  .header h1 { margin: 0; color: #333F20; }
  .logout-btn { background: #333; color: white; padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; }

  .dashboard-content { display: flex; gap: 20px; height: 100%; }
  .menu-section { flex: 2; background: white; padding: 20px; border-radius: 8px; overflow-y: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
  .cart-section { flex: 1; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; flex-direction: column;}
  
  .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .menu-item-btn { 
    padding: 15px; background: #f4f4f4; border: 1px solid #ddd; border-radius: 6px; 
    text-align: center; cursor: pointer; font-weight: bold; transition: 0.2s;
  }
  .menu-item-btn:hover { background: #333F20; color: white; }
  
  #cart-items { flex: 1; overflow-y: auto; margin-bottom: 20px; }
  .cart-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
  .total-row { font-size: 24px; font-weight: bold; color: #BD5B34; text-align: right; }
  .checkout-btn { width: 100%; padding: 15px; background: #333F20; color: white; border: none; border-radius: 6px; font-size: 20px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>

  <!-- SECURE LOGIN SCREEN -->
  <div id="login-screen">
    <div class="login-box">
      <h2>Green Fusion POS</h2>
      <p>Staff Login Required</p>
      <input type="email" id="email" class="input-field" placeholder="Staff Email ID" required>
      <input type="password" id="password" class="input-field" placeholder="Password" required>
      <button class="login-btn" onclick="loginStaff()">Secure Login</button>
      <div id="login-error">Invalid Email or Password!</div>
    </div>
  </div>

  <!-- BILLING DASHBOARD (Only shows if logged in) -->
  <div id="billing-dashboard">
    <div class="header">
      <h1>Green Fusion — Billing Counter</h1>
      <button class="logout-btn" onclick="logoutStaff()">Logout Session</button>
    </div>
    
    <div class="dashboard-content">
      <!-- Menu Items List -->
      <div class="menu-section">
        <h3>Menu Items</h3>
        <div class="menu-grid" id="pos-menu-grid">Loading menu...</div>
      </div>
      
      <!-- Cart and Checkout -->
      <div class="cart-section">
        <h3>Current Order</h3>
        <div id="cart-items"></div>
        <div class="total-row">Total: ₹<span id="cart-total">0</span></div>
        <button class="checkout-btn" onclick="checkoutOrder()" style="margin-top: 20px;">Complete Bill</button>
      </div>
    </div>
  </div>

<script>
  const SUPABASE_URL = "https://vdabufmcqzdilkhzrxim.supabase.co";
  const SUPABASE_KEY = "sb_publishable_D_7MmPn7tLWsxcPnuH6aHA_I_V19fJ6";
  
  let accessToken = sessionStorage.getItem('gf_staff_token');
  let cart = [];
  let menuData = [];

  // Check if staff is already logged in on page load
  window.onload = () => {
    if (accessToken) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('billing-dashboard').style.display = 'flex';
      fetchPOSMenu();
    } else {
      document.getElementById('billing-dashboard').style.display = 'none';
    }
  };

  // Login Function using Supabase Auth API
  async function loginStaff() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errorBox = document.getElementById('login-error');
    
    errorBox.style.display = 'none';
    document.querySelector('.login-btn').innerText = "Verifying...";

    try {
      const response = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
        method: 'POST',
        headers: {
          "apikey": SUPABASE_KEY,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ email: email, password: password })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error_description || "Login Failed");
      }

      // Success! Save secure token and show dashboard
      sessionStorage.setItem('gf_staff_token', data.access_token);
      accessToken = data.access_token;
      
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('billing-dashboard').style.display = 'flex';
      
      fetchPOSMenu(); // Load items to bill

    } catch (err) {
      errorBox.innerText = err.message;
      errorBox.style.display = 'block';
    } finally {
      document.querySelector('.login-btn').innerText = "Secure Login";
    }
  }

  // Logout Function
  function logoutStaff() {
    sessionStorage.removeItem('gf_staff_token');
    window.location.reload(); // Refresh page to lock it back up
  }

  // Fetch Menu for the POS
  async function fetchPOSMenu() {
    try {
      const response = await fetch(`${SUPABASE_URL}/rest/v1/menu_items?select=*`, {
        headers: { 
          "apikey": SUPABASE_KEY, 
          "Authorization": `Bearer ${SUPABASE_KEY}` // For public viewing
        }
      });
      menuData = await response.json();
      renderPOSMenu();
    } catch (err) {
      console.error("Failed to fetch menu for POS");
    }
  }

  // Render items into clickable buttons
  function renderPOSMenu() {
    const grid = document.getElementById('pos-menu-grid');
    grid.innerHTML = '';
    menuData.forEach(item => {
      grid.innerHTML += `
        <div class="menu-item-btn" onclick="addToCart('${item.name}', ${item.price})">
          ${item.name} <br> <small style="color: #BD5B34;">₹${item.price}</small>
        </div>
      `;
    });
  }

  // Add item to cart
  function addToCart(name, price) {
    cart.push({ name, price });
    updateCartDisplay();
  }

  // Update Cart UI
  function updateCartDisplay() {
    const cartBox = document.getElementById('cart-items');
    const totalBox = document.getElementById('cart-total');
    cartBox.innerHTML = '';
    let total = 0;
    
    cart.forEach((item, index) => {
      total += item.price;
      cartBox.innerHTML += `
        <div class="cart-item">
          <span>${item.name}</span>
          <span>₹${item.price} <button style="color:red;border:none;background:none;cursor:pointer;" onclick="removeFromCart(${index})">X</button></span>
        </div>
      `;
    });
    totalBox.innerText = total;
  }

  // Remove single item from cart
  function removeFromCart(index) {
    cart.splice(index, 1);
    updateCartDisplay();
  }

  // Checkout order
  function checkoutOrder() {
    if (cart.length === 0) return alert("Cart is empty!");
    alert(`Bill generated successfully for ₹${document.getElementById('cart-total').innerText}!\nPrint receipt function will run here.`);
    cart = []; // Clear cart after billing
    updateCartDisplay();
  }
</script>
</body>
</html>
