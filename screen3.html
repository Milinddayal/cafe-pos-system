<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Green Fusion — Bar & Juices</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Jost:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  body { 
    background: #FAF5EA; 
    color: #2B2822; 
    font-family: 'Jost', sans-serif; 
    margin: 0; 
    padding: 20px; 
    height: 100vh; 
    overflow: hidden; 
    display: flex; 
    flex-direction: column; 
    position: relative;
  }
  .bg-animation {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    overflow: hidden;
    z-index: 0;
    pointer-events: none;
  }
  .floating-item {
    position: absolute;
    top: -10vh;
    font-size: 4rem;
    opacity: 0.35;
    animation: fall linear infinite;
  }
  @keyframes fall {
    0% { transform: translateY(-10vh) rotate(0deg); }
    100% { transform: translateY(110vh) rotate(360deg); }
  }
  h1, .menu-grid { position: relative; z-index: 1; }
  h1 { font-family: 'Cormorant Garamond', serif; font-size: 42px; color: #333F20; text-align: center; margin: 0 0 20px 0; }
  .menu-grid { flex: 1; max-width: 1400px; width: 100%; margin: 0 auto; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; align-content: start; }
  .item-row { background: rgba(255, 255, 255, 0.95); padding: 12px 20px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(43,40,34,0.1); font-size: 18px; backdrop-filter: blur(2px); }
  .item-price { color: #BD5B34; font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 22px; }
  .sold-out { opacity: 0.4; }
  .cat-label { display: block; font-size: 11px; color: #666; margin-top: 2px; }
</style>
</head>
<body>
  <div class="bg-animation">
    <div class="floating-item" style="left: 10%; animation-duration: 11s; animation-delay: 0s;">🍊</div>
    <div class="floating-item" style="left: 30%; animation-duration: 14s; animation-delay: 2s;">🍹</div>
    <div class="floating-item" style="left: 50%; animation-duration: 10s; animation-delay: 1s;">🍋</div>
    <div class="floating-item" style="left: 70%; animation-duration: 13s; animation-delay: 3s;">🥤</div>
    <div class="floating-item" style="left: 90%; animation-duration: 12s; animation-delay: 4s;">🍉</div>
  </div>

  <h1>🍊 Juices &amp; Mocktails 🍹</h1>
  <div class="menu-grid" id="menu-list">Loading...</div>

<script>
  const sb = supabase.createClient("https://vdabufmcqzdilkhzrxim.supabase.co", "sb_publishable_D_7MmPn7tLWsxcPnuH6aHA_I_V19fJ6");
  const targetCategories = ['🍊 Seasonal Fruit Juices', '🍹 Mocktails', '💧 Water'];
  async function loadMenu() {
    const { data } = await sb.from('menu_items').select('*').in('category', targetCategories);
    const container = document.getElementById('menu-list');
    container.innerHTML = '';
    data.forEach(item => {
      container.innerHTML += `
        <div class="item-row ${item.stock <= 0 ? 'sold-out' : ''}">
          <div>
            <span><b>${item.name}</b></span>
            <small class="cat-label">${item.category}</small>
          </div>
          <span class="item-price">₹${item.price}</span>
        </div>`;
    });
  }
  loadMenu();
  sb.channel('screen3').on('postgres_changes', { event: '*', schema: 'public', table: 'menu_items' }, loadMenu).subscribe();
</script>
</body>
</html>
